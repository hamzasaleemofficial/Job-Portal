services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    networks:
      - mern-network
    env_file: 
      - ./backend/.env
    environment:  
      MONGO_URI: mongodb://mongodb:27017/mydatabase
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports: 
      - "5173:5173"
    networks:
      - mern-network
    environment: 
      REACT_APP_API_URI: http://localhost:5000

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db
    
networks:
  mern-network:
    driver: bridge

volumes: 
  mongo-data:
      
  
      


